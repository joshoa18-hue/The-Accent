<!-- Sign-in email for The Ascent. Used for both new and returning learners. -->
<h2>Continue your ascent</h2>
<p>Use the button below to sign in to The Ascent. The link works once and expires in an hour.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email"
     style="display:inline-block;padding:12px 20px;background:#cfa24a;color:#060b18;border-radius:10px;text-decoration:none;font-weight:600">
    Sign in to The Ascent
  </a>
</p>
<p>If you didn't ask for this email, you can ignore it. Nobody can sign in without the link.</p>
